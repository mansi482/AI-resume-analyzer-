{% extends 'base/base.html' %}

{% block body %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg); padding: 2rem;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <div class="card-header text-center">
            <h2 class="m-0" style="font-size: 1.25rem;">Reset Password</h2>
            <p class="text-muted m-0 mt-2" style="font-size: 0.875rem;">Enter your email to receive a reset link</p>
        </div>
        
        <div class="card-body">
            <form method="POST" action="">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div style="color: var(--danger); font-size: 0.75rem; margin-top: 0.25rem;">
                                {{ field.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Send Reset Link</button>
            </form>
        </div>
        
        <div class="card-footer text-center" style="font-size: 0.875rem;">
            Remember your password? <a href="{% url 'login' %}" style="font-weight: 600;">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
