{% extends 'base/base.html' %}

{% block body %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg); padding: 2rem;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <div class="card-header text-center">
            <a href="{% url 'home' %}" style="font-size: 1.5rem; font-weight: 800; color: var(--primary); display: inline-flex; align-items: center; gap: 0.5rem;">
                <i class="fas fa-brain"></i> AI Resume
            </a>
            <h2 class="mt-4 m-0" style="font-size: 1.25rem;">Welcome Back</h2>
            <p class="text-muted m-0" style="font-size: 0.875rem;">Login to your account to continue</p>
        </div>
        
        <div class="card-body">
            <form method="POST" action="">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="form-group">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div style="color: var(--danger); font-size: 0.75rem; margin-top: 0.25rem;">
                                {{ field.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}
                
                <div class="flex justify-between items-center mb-4" style="font-size: 0.875rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="{% url 'forgot_password' %}">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Login</button>
            </form>
        </div>
        
        <div class="card-footer text-center" style="font-size: 0.875rem;">
            Don't have an account? <a href="{% url 'register' %}" style="font-weight: 600;">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
